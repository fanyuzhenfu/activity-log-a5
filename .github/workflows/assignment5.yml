name: Assignment 5 Build Test Release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_scenario:
        description: Select pass or an intentional failure demonstration
        required: true
        default: pass
        type: string

permissions:
  contents: read

env:
  BUILD_ASSET: activity-log-build.zip
  BUILD_CHECKSUM: artifact.sha256
  TEST_SCENARIO: ${{ inputs.test_scenario || 'pass' }}

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-name: ${{ steps.version.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - id: version
        shell: bash
        run: |
          version="1.0.${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact-name=activity-log-a5-$version" >> "$GITHUB_OUTPUT"
      - shell: bash
        run: |
          set -euo pipefail
          mkdir package
          cp -R dist action.yml package.json README.md LICENSE package/
          (cd package && zip -qr "../$BUILD_ASSET" .)
          sha256sum "$BUILD_ASSET" > "$BUILD_CHECKSUM"
          cat "$BUILD_CHECKSUM"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact-name }}
          path: |
            ${{ env.BUILD_ASSET }}
            ${{ env.BUILD_CHECKSUM }}
          retention-days: 14

  unit:
    name: Unit tests (Node ${{ matrix.node }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { node: [20, 22] }
    env: { TEST_ENV: unit }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ matrix.node }}, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: ${{ needs.build.outputs.artifact-name }}, path: release }
      - name: Run unit tests with JUnit output
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          node --test test/templateEngine.test.js test/unit/template.unit.test.js --test-reporter=junit --test-reporter-destination=reports/unit-${{ matrix.node }}.xml
      - name: Intentional unit failure demonstration
        if: env.TEST_SCENARIO == 'fail-unit'
        run: npm run test:demo
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit-node-${{ matrix.node }}
          path: reports/
          if-no-files-found: warn

  integration:
    name: Integration tests
    needs: [build, unit]
    runs-on: ubuntu-latest
    env: { TEST_ENV: staging }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: ${{ needs.build.outputs.artifact-name }}, path: release }
      - name: Run integration tests with JUnit output
        run: |
          mkdir -p reports
          node --test test/integration/event-pipeline.integration.test.js --test-reporter=junit --test-reporter-destination=reports/integration.xml
      - name: Intentional integration failure demonstration
        if: env.TEST_SCENARIO == 'fail-integration'
        run: npm run test:demo -- --test-name-pattern='never-match'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-integration
          path: reports/
          if-no-files-found: warn

  coverage:
    name: Coverage gate (Node 22)
    needs: [build, unit, integration]
    runs-on: ubuntu-latest
    env: { TEST_ENV: staging, COVERAGE_THRESHOLD: '80' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Run tests and generate LCOV coverage
        run: |
          mkdir -p coverage
          node --experimental-test-coverage --test test/templateEngine.test.js test/unit/template.unit.test.js test/integration/event-pipeline.integration.test.js --test-reporter=lcov --test-reporter-destination=coverage/lcov.info
      - name: Enforce coverage threshold
        shell: bash
        run: |
          set -euo pipefail
          test -s coverage/lcov.info
          line="$(grep -E '^LH:' coverage/lcov.info | awk -F: '{s+=$2} END {print s+0}')"
          hit="$(grep -E '^LF:' coverage/lcov.info | awk -F: '{s+=$2} END {print s+0}')"
          percent="$(awk -v h="$hit" -v l="$line" 'BEGIN { if (l == 0) print 0; else printf "%.2f", h*100/l }')"
          echo "Line coverage: $percent% (threshold ${COVERAGE_THRESHOLD}%)"
          awk -v p="$percent" -v t="$COVERAGE_THRESHOLD" 'BEGIN { exit !(p >= t) }'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-22
          path: coverage/
          retention-days: 14

  deploy-dev:
    name: Deploy dev
    needs: [build, unit, integration, coverage]
    runs-on: ubuntu-latest
    environment: dev
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: ${{ needs.build.outputs.artifact-name }}, path: release }
      - name: Verify immutable artifact and publish dev release
        env: { GH_TOKEN: ${{ github.token }}, GH_REPO: ${{ github.repository }} }
        run: |
          set -euo pipefail
          (cd release && sha256sum -c artifact.sha256)
          gh release create "dev-v${{ needs.build.outputs.version }}" release/activity-log-build.zip --repo "$GH_REPO" --target "$GITHUB_SHA" --prerelease --title "Dev ${{ needs.build.outputs.version }}" --notes "Automated release after passing tests"

  deploy-staging:
    name: Deploy staging
    needs: [build, deploy-dev]
    runs-on: ubuntu-latest
    environment: staging
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: ${{ needs.build.outputs.artifact-name }}, path: release }
      - name: Verify immutable artifact and publish staging release
        env: { GH_TOKEN: ${{ github.token }}, GH_REPO: ${{ github.repository }} }
        run: |
          set -euo pipefail
          (cd release && sha256sum -c artifact.sha256)
          gh release create "staging-v${{ needs.build.outputs.version }}" release/activity-log-build.zip --repo "$GH_REPO" --target "$GITHUB_SHA" --prerelease --title "Staging ${{ needs.build.outputs.version }}" --notes "Automated release after passing tests"

  deploy-production:
    name: Deploy production after human approval
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: ${{ needs.build.outputs.artifact-name }}, path: release }
      - name: Verify immutable artifact and publish production release
        env: { GH_TOKEN: ${{ github.token }}, GH_REPO: ${{ github.repository }} }
        run: |
          set -euo pipefail
          (cd release && sha256sum -c artifact.sha256)
          gh release create "prod-v${{ needs.build.outputs.version }}" release/activity-log-build.zip --repo "$GH_REPO" --target "$GITHUB_SHA" --title "Production ${{ needs.build.outputs.version }}" --notes "Human-approved production release"
